name: Update Space Shooter

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  update-game:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download latest Space Shooter
        run: |
          git clone --depth 1 \
            https://github.com/czl9707/gh-space-shooter.git \
            space-shooter

      - name: Install Space Shooter
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./space-shooter

      - name: Generate game
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh-space-shooter \
            "${{ github.repository_owner }}" \
            --output game.gif \
            --strategy random \
            --fps 40

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.gif

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Space Shooter"
            git push
          fi
