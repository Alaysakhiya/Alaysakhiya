name: Update Space Shooter

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download latest Space Shooter
        run: |
          git clone --depth 1 \
            https://github.com/czl9707/gh-space-shooter.git \
            space-shooter

      - name: Install Space Shooter
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./space-shooter

      - name: Generate game
        run: |
          gh-space-shooter \
            "${{ github.repository_owner }}" \
            --output game.gif \
            --strategy random \
            --fps 40

      - name: Update README
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path

          readme = Path("README.md")
          text = readme.read_text()

          marker = "Last updated: "
          date = datetime.now(timezone.utc).strftime("%Y-%m-%d")
          line = f"Last updated: {date}"

          if marker in text:
              lines = text.splitlines()
              text = "\n".join(
                  line if item.startswith(marker) else item
                  for item in lines
              ) + "\n"
          else:
              text += f"\n{line}\n"

          readme.write_text(text)
          PY

      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add game.gif README.md

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Space Shooter and README"
            git push
          fi
