<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" style="background-color: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <!-- Background Card Gradient -->
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Radar Area Fill Gradient -->
    <linearGradient id="radar-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.45" />
    </linearGradient>

    <!-- Node Glow Filters -->
    <filter id="glow-purple" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-polygon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .grid-line {
      stroke: #374151;
      stroke-width: 1;
      stroke-dasharray: 2, 4;
      opacity: 0.6;
    }
    .axis-line {
      stroke: #4b5563;
      stroke-width: 1;
      opacity: 0.4;
    }
    .radar-poly {
      stroke: url(#poly-stroke);
      stroke-width: 2.5;
      fill: url(#radar-glow);
      filter: url(#glow-polygon);
      transition: all 0.5s ease-in-out;
    }
    .radar-poly:hover {
      fill-opacity: 0.6;
      stroke-width: 3.5;
    }
    .node {
      fill: #ffffff;
      stroke-width: 2;
      transition: r 0.2s ease;
      cursor: pointer;
    }
    .node-purple {
      stroke: #a855f7;
      filter: url(#glow-purple);
    }
    .node-cyan {
      stroke: #06b6d4;
      filter: url(#glow-purple);
    }
    .node:hover {
      r: 6;
    }
    .axis-label {
      font-size: 13px;
      font-weight: 600;
      fill: #e5e7eb;
      letter-spacing: 0.5px;
    }
    .scale-label {
      font-size: 9px;
      fill: #9ca3af;
      font-weight: 500;
    }
    .card {
      stroke: #1f2937;
      stroke-width: 1.5;
    }
  </style>

  <linearGradient id="poly-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#c084fc" />
    <stop offset="100%" stop-color="#22d3ee" />
  </linearGradient>

  <!-- Container Card -->
  <rect width="498" height="498" x="1" y="1" rx="16" fill="url(#card-bg)" class="card" />

  <!-- Radar Grid Hexagons (Levels 1 to 5) -->
  <!-- Level 1 (r = 30) -->
  <polygon points="250,220 275.98,235 275.98,265 250,280 224.02,265 224.02,235" class="grid-line" />
  <!-- Level 2 (r = 60) -->
  <polygon points="250,190 301.96,220 301.96,280 250,310 198.04,280 198.04,220" class="grid-line" />
  <!-- Level 3 (r = 90) -->
  <polygon points="250,160 327.94,205 327.94,295 250,340 172.06,295 172.06,205" class="grid-line" />
  <!-- Level 4 (r = 120) -->
  <polygon points="250,130 353.92,190 353.92,310 250,370 146.08,310 146.08,190" class="grid-line" />
  <!-- Level 5 (r = 150) -->
  <polygon points="250,100 379.9,175 379.9,325 250,400 120.1,325 120.1,175" class="grid-line" />

  <!-- Axes -->
  <!-- Axis 0 (Frontend) -->
  <line x1="250" y1="250" x2="250" y2="100" class="axis-line" />
  <!-- Axis 1 (Backend) -->
  <line x1="250" y1="250" x2="379.9" y2="175" class="axis-line" />
  <!-- Axis 2 (DevOps) -->
  <line x1="250" y1="250" x2="379.9" y2="325" class="axis-line" />
  <!-- Axis 3 (AI/ML) -->
  <line x1="250" y1="250" x2="250" y2="400" class="axis-line" />
  <!-- Axis 4 (Mobile) -->
  <line x1="250" y1="250" x2="120.1" y2="325" class="axis-line" />
  <!-- Axis 5 (Languages) -->
  <line x1="250" y1="250" x2="120.1" y2="175" class="axis-line" />

  <!-- Scale Labels -->
  <text x="254" y="217" class="scale-label">20%</text>
  <text x="254" y="187" class="scale-label">40%</text>
  <text x="254" y="157" class="scale-label">60%</text>
  <text x="254" y="127" class="scale-label">80%</text>
  <text x="254" y="97" class="scale-label">100%</text>

  <!-- Skill Radar Polygon Overlay -->
  <polygon points="250,115 353.92,190 340.93,302.5 250,376 172.06,295 127.9,179.5" class="radar-poly" />

  <!-- Nodes (Vertices) -->
  <!-- Frontend (level 4.5 -> y = 115) -->
  <circle cx="250" cy="115" r="4.5" class="node node-purple" />
  <!-- Backend (level 4.0 -> x = 353.92, y = 190) -->
  <circle cx="353.92" cy="190" r="4.5" class="node node-purple" />
  <!-- DevOps (level 3.5 -> x = 340.93, y = 302.5) -->
  <circle cx="340.93" cy="302.5" r="4.5" class="node node-cyan" />
  <!-- AI/ML (level 4.2 -> y = 376) -->
  <circle cx="250" cy="376" r="4.5" class="node node-cyan" />
  <!-- Mobile (level 3.0 -> x = 172.06, y = 295) -->
  <circle cx="172.06" cy="295" r="4.5" class="node node-cyan" />
  <!-- Languages (level 4.7 -> x = 127.9, y = 179.5) -->
  <circle cx="127.9" cy="179.5" r="4.5" class="node node-purple" />

  <!-- Axis Labels -->
  <text x="250" y="75" text-anchor="middle" class="axis-label">Frontend</text>
  <text x="390" y="170" text-anchor="start" class="axis-label">Backend</text>
  <text x="390" y="338" text-anchor="start" class="axis-label">DevOps &amp; Cloud</text>
  <text x="250" y="423" text-anchor="middle" class="axis-label">AI / Data Science</text>
  <text x="110" y="338" text-anchor="end" class="axis-label">Mobile</text>
  <text x="110" y="170" text-anchor="end" class="axis-label">Languages</text>

  <!-- Title / Legend -->
  <text x="25" y="35" font-size="16" font-weight="700" fill="#f3f4f6" letter-spacing="0.5px">SKILL RADAR</text>
  <text x="25" y="52" font-size="10" font-weight="500" fill="#9ca3af" letter-spacing="0.5px">ALAY SAKHIYA — PROFILE STACK</text>
</svg>
